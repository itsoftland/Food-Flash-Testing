{% extends 'companyadmin/layouts/base.html' %}

{% block title %}Dashboard | Superadmin{% endblock %}

{% block content %}
<section class="content-header">
  <div class="container-fluid">
    <div class="row mb-2">
      <div class="col-sm-6">
        <h1 class="text-golden">{{ LABELS.dashboard.title }}</h1>
      </div>
    </div>
  </div>
</section>

<section class="content">
  <div class="container-fluid">
    <div class="card shadow-sm border-0">
      <div class="card-header" style="background-color: #fdbf50; color: #212529;">
        <h3 class="card-title mb-0">Welcome, Super Admin!</h3>
      </div>
      <div class="card-body">
        <p class="mb-0">{{ LABELS.dashboard.body }}</p>
      </div>
    </div>
  </div>
</section>
{% endblock %}
