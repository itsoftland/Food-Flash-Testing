{% extends "orders/layouts/base.html" %}
{% load static %}

{% block extra_css %}
<link rel="stylesheet" href="{% static 'orders/css/dineflash/dine_register.css' %}">
<style>
    .utility-item {
        display: flex;
        justify-content: space-between;
        align-items: center;
        gap: 12px;
        padding: 20px;
        background: #ffffff;
        border-radius: 12px;
        margin-bottom: 12px;
        box-shadow: 0 4px 6px rgba(0,0,0,0.05);
        border: 1px solid #eee;
    }
    .utility-item-main {
        display: flex;
        align-items: center;
        gap: 14px;
        flex: 1;
        min-width: 0;
    }
    .utility-thumb {
        width: 56px;
        height: 56px;
        border-radius: 10px;
        object-fit: cover;
        flex-shrink: 0;
        border: 1px solid #eee;
        background: #f8f9fa;
    }
    .utility-name {
        font-size: 1.2rem;
        font-weight: 600;
        color: #333;
        line-height: 1.3;
    }
    .qty-controls {
        display: flex;
        align-items: center;
        gap: 15px;
    }
    .qty-btn {
        width: 36px;
        height: 36px;
        border-radius: 50%;
        border: 1px solid #ff6b6b;
        background: white;
        color: #ff6b6b;
        font-weight: bold;
        font-size: 1.2rem;
        cursor: pointer;
        display: flex;
        align-items: center;
        justify-content: center;
        transition: all 0.2s;
    }
    .qty-btn:hover {
        background: #ff6b6b;
        color: white;
    }
    .qty-display {
        font-weight: 700;
        font-size: 1.3rem;
        min-width: 20px;
        text-align: center;
    }
    .main-btn {
        background-color: var(--primary-color, #ff6b6b);
        color: white;
        border: none;
        padding: 16px;
        border-radius: 12px;
        width: 100%;
        font-weight: 600;
        font-size: 1.1rem;
        margin-top: 25px;
        box-shadow: 0 4px 12px rgba(255,107,107,0.3);
        transition: transform 0.2s;
    }
    .main-btn:active {
        transform: scale(0.98);
    }
    .food-type-filter {
        display: flex;
        justify-content: center;
        gap: 8px;
        margin-bottom: 20px;
        flex-wrap: wrap;
    }
    .food-type-filter-btn {
        border: 1px solid #ff6b6b;
        background: #fff;
        color: #ff6b6b;
        border-radius: 999px;
        padding: 8px 18px;
        font-weight: 600;
        font-size: 0.95rem;
        cursor: pointer;
        transition: all 0.2s;
    }
    .food-type-filter-btn:hover,
    .food-type-filter-btn.active {
        background: #ff6b6b;
        color: #fff;
    }
    .utility-item.is-hidden {
        display: none;
    }
    .food-type-badge {
        display: inline-block;
        margin-top: 4px;
        padding: 2px 8px;
        border-radius: 6px;
        font-size: 0.75rem;
        font-weight: 600;
        text-transform: uppercase;
        letter-spacing: 0.02em;
    }
    .food-type-badge.veg {
        background: #e8f5e9;
        color: #2e7d32;
    }
    .food-type-badge.non-veg {
        background: #ffebee;
        color: #c62828;
    }
</style>
{% endblock %}

{% block content %}
<div class="container mt-4 mb-5 pb-5">
    <h3 class="text-center mb-4 font-weight-bold" style="color: #333;">Select Food Counters</h3>

    <div class="food-type-filter" id="food-type-filter" role="group" aria-label="Filter by food type">
        <button type="button" class="food-type-filter-btn active" data-food-type="">All</button>
        <button type="button" class="food-type-filter-btn" data-food-type="veg">Veg</button>
        <button type="button" class="food-type-filter-btn" data-food-type="non_veg">Non Veg</button>
    </div>
    
    <div id="utilities-container">
        <!-- Utilities will be loaded here -->
        <div class="text-center p-4">
            <div class="spinner-border text-primary" role="status">
                <span class="visually-hidden">Loading...</span>
            </div>
            <p class="mt-2 text-muted">Loading counters...</p>
        </div>
    </div>

</div>

<div class="fixed-bottom bg-white p-3 border-top shadow-lg" style="max-width: 600px; margin: 0 auto; display: none; bottom: 50px; z-index: 1020;" id="bottom-bar">
    <button class="main-btn mt-0" id="proceed-btn">Proceed (<span id="total-qty">0</span> items)</button>
</div>
{% endblock %}

{% block extra_js %}
<script>
    document.addEventListener("DOMContentLoaded", function() {
        const vendorId = new URLSearchParams(window.location.search).get("vendor_id") || localStorage.getItem("buffet_vendor_id");
        if (!vendorId) {
            alert("Vendor not found.");
            return;
        }

        const utilitiesContainer = document.getElementById("utilities-container");
        const foodTypeFilter = document.getElementById("food-type-filter");
        const proceedBtn = document.getElementById("proceed-btn");
        const totalQtySpan = document.getElementById("total-qty");
        const bottomBar = document.getElementById("bottom-bar");
        let utilityQuantities = {};
        let allUtilities = [];
        let activeFoodTypeFilter = "";

        function escapeHtml(text) {
            const div = document.createElement("div");
            div.textContent = text == null ? "" : String(text);
            return div.innerHTML;
        }

        function foodTypeLabel(foodType) {
            if (foodType === "veg") return "Veg";
            if (foodType === "non_veg") return "Non Veg";
            return "";
        }

        function matchesFoodTypeFilter(foodType) {
            if (!activeFoodTypeFilter) return true;
            return foodType === activeFoodTypeFilter;
        }

        function applyFoodTypeFilter() {
            const rows = utilitiesContainer.querySelectorAll(".utility-item");
            let visibleCount = 0;
            rows.forEach((row) => {
                const foodType = row.dataset.foodType || "";
                const show = matchesFoodTypeFilter(foodType);
                row.classList.toggle("is-hidden", !show);
                if (show) visibleCount += 1;
            });

            let emptyMsg = utilitiesContainer.querySelector(".filter-empty-msg");
            if (visibleCount === 0 && allUtilities.length > 0) {
                if (!emptyMsg) {
                    emptyMsg = document.createElement("p");
                    emptyMsg.className = "text-center p-4 text-muted filter-empty-msg";
                    utilitiesContainer.appendChild(emptyMsg);
                }
                const label = activeFoodTypeFilter === "veg" ? "Veg" : "Non Veg";
                emptyMsg.textContent = `No ${label} counters available.`;
                emptyMsg.style.display = "block";
            } else if (emptyMsg) {
                emptyMsg.style.display = "none";
            }
        }

        function buildUtilityRow(u) {
            const row = document.createElement("div");
            row.className = "utility-item";
            row.dataset.foodType = u.food_type || "";

            const main = document.createElement("div");
            main.className = "utility-item-main";

            if (u.image_url) {
                const img = document.createElement("img");
                img.className = "utility-thumb";
                img.src = u.image_url;
                img.alt = "";
                img.loading = "lazy";
                main.appendChild(img);
            }

            const textWrap = document.createElement("div");
            const nameEl = document.createElement("div");
            nameEl.className = "utility-name";
            nameEl.textContent = u.display_name || u.utility_name || u.name || "";
            textWrap.appendChild(nameEl);

            const badgeLabel = foodTypeLabel(u.food_type);
            if (badgeLabel) {
                const badge = document.createElement("span");
                badge.className = "food-type-badge " + (u.food_type === "veg" ? "veg" : "non-veg");
                badge.textContent = badgeLabel;
                textWrap.appendChild(badge);
            }
            main.appendChild(textWrap);

            const controls = document.createElement("div");
            controls.className = "qty-controls";

            const minusBtn = document.createElement("button");
            minusBtn.type = "button";
            minusBtn.className = "qty-btn minus-btn";
            minusBtn.dataset.id = String(u.id);
            minusBtn.textContent = "-";

            const qtySpan = document.createElement("span");
            qtySpan.className = "qty-display";
            qtySpan.id = "qty-" + u.id;
            qtySpan.textContent = "0";

            const plusBtn = document.createElement("button");
            plusBtn.type = "button";
            plusBtn.className = "qty-btn plus-btn";
            plusBtn.dataset.id = String(u.id);
            plusBtn.textContent = "+";

            controls.appendChild(minusBtn);
            controls.appendChild(qtySpan);
            controls.appendChild(plusBtn);

            row.appendChild(main);
            row.appendChild(controls);
            return row;
        }

        function updateTotal() {
            let total = 0;
            for (let id in utilityQuantities) {
                total += utilityQuantities[id].qty;
            }
            totalQtySpan.innerText = total;
            
            if (total > 0) {
                bottomBar.style.display = "block";
            } else {
                bottomBar.style.display = "none";
            }
        }

        fetch(`{% url 'utility_list' %}?vendor_id=${vendorId}`)
            .then(res => res.json())
            .then(data => {
                allUtilities = data.utilities || [];
                if (allUtilities.length === 0) {
                    utilitiesContainer.innerHTML = "<p class='text-center p-4'>No food counters available.</p>";
                    if (foodTypeFilter) foodTypeFilter.style.display = "none";
                    return;
                }

                utilitiesContainer.innerHTML = "";

                allUtilities.forEach(u => {
                    utilityQuantities[u.id] = {
                        name: u.display_name || u.utility_name,
                        qty: 0,
                        options: u.options || []
                    };
                    utilitiesContainer.appendChild(buildUtilityRow(u));
                });

                applyFoodTypeFilter();

                if (foodTypeFilter) {
                    foodTypeFilter.querySelectorAll(".food-type-filter-btn").forEach((btn) => {
                        btn.addEventListener("click", () => {
                            activeFoodTypeFilter = btn.dataset.foodType || "";
                            foodTypeFilter.querySelectorAll(".food-type-filter-btn").forEach((b) => {
                                b.classList.toggle("active", b === btn);
                            });
                            applyFoodTypeFilter();
                        });
                    });
                }

                document.querySelectorAll(".plus-btn").forEach(btn => {
                    btn.addEventListener("click", (e) => {
                        const id = e.currentTarget.getAttribute("data-id");
                        utilityQuantities[id].qty++;
                        document.getElementById(`qty-${id}`).innerText = utilityQuantities[id].qty;
                        updateTotal();
                    });
                });

                document.querySelectorAll(".minus-btn").forEach(btn => {
                    btn.addEventListener("click", (e) => {
                        const id = e.currentTarget.getAttribute("data-id");
                        if (utilityQuantities[id].qty > 0) {
                            utilityQuantities[id].qty--;
                            document.getElementById(`qty-${id}`).innerText = utilityQuantities[id].qty;
                            updateTotal();
                        }
                    });
                });
            })
            .catch(err => {
                console.error(err);
                utilitiesContainer.innerHTML = "<p class='text-center text-danger'>Failed to load counters.</p>";
            });

        proceedBtn.addEventListener("click", function() {
            const selected = Object.keys(utilityQuantities)
                .map(id => ({ id: id, name: utilityQuantities[id].name, qty: utilityQuantities[id].qty, options: utilityQuantities[id].options }))
                .filter(item => item.qty > 0);

            if (selected.length === 0) {
                return;
            }

            sessionStorage.setItem("buffet_selected_utilities", JSON.stringify(selected));
            window.location.href = `{% url 'buffet_combined_options' %}?vendor_id=${vendorId}`;
        });
    });
</script>
{% endblock %}
